<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1020" />
    <title>Laser Bounce</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1020;
        --panel: #151a30;
        --edge: #3d4d80;
        --ink: #e9ecff;
        --dim: #8e97c0;
        --gold: #ffd23f;
        --orange: #e8801f;
        --orange-dark: #8f420b;
        --green: #2cff6e;
        --font: 'Courier New', ui-monospace, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        background-image: radial-gradient(circle at 50% 40%, #1a2146 0%, var(--bg) 70%);
        color: var(--ink);
        font: bold 14px/1.35 var(--font);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
      }
      #bar {
        width: 100%;
        max-width: 720px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px 12px;
        padding: 8px 12px 4px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        color: var(--gold);
        text-shadow: 2px 2px 0 var(--orange-dark), 0 0 8px rgba(255, 210, 63, 0.35);
        letter-spacing: 0.12em;
      }
      #level-label { color: var(--ink); font-size: 13px; flex: 1 1 auto; }
      .buttons { display: flex; gap: 6px; }
      button {
        font: bold 14px/1 var(--font);
        text-transform: uppercase;
        color: #1a0e04;
        background: var(--orange);
        border: 0;
        border-bottom: 3px solid var(--orange-dark);
        border-right: 3px solid var(--orange-dark);
        box-shadow: 0 0 0 2px #0a0c16;
        padding: 7px 10px;
        min-width: 34px;
        cursor: pointer;
      }
      button:active:not(:disabled) { transform: translate(1px, 2px); border-bottom-width: 1px; border-right-width: 1px; }
      button:disabled { background: #4b5270; border-color: #2b3048; color: #20243a; cursor: default; }
      button.on { background: var(--gold); }
      button.primary { background: var(--gold); border-color: #8a6d0c; }
      .stage { flex: 0 0 auto; display: flex; justify-content: center; padding-top: 6px; }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        -webkit-touch-callout: none;
        box-shadow: 0 0 0 3px #070914, 0 0 24px rgba(44, 255, 110, 0.12);
      }
      #hint { margin: 8px 12px 0; max-width: 520px; text-align: center; color: var(--dim); font-size: 12px; min-height: 2.7em; }
      #help {
        position: fixed;
        right: 12px;
        top: 56px;
        z-index: 5;
        width: min(340px, calc(100vw - 24px));
        background: var(--panel);
        border: 3px solid var(--edge);
        box-shadow: 0 0 0 3px #070914;
        padding: 10px 12px 12px;
        text-transform: none;
      }
      #help h2 { margin: 0 0 6px; font-size: 14px; color: var(--gold); text-transform: uppercase; }
      #help dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12px; }
      #help dt { color: var(--gold); white-space: nowrap; }
      #help dd { margin: 0; color: var(--ink); font-weight: normal; }
      #help-close { position: absolute; top: 6px; right: 6px; padding: 3px 7px; min-width: 0; }
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: rgba(5, 7, 16, 0.72);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .modal {
        background: var(--panel);
        border: 3px solid var(--edge);
        box-shadow: 0 0 0 3px #070914, 6px 6px 0 3px #070914;
        padding: 16px 18px;
        width: min(360px, 100%);
        text-align: center;
      }
      .modal h2 { margin: 0 0 8px; color: var(--gold); font-size: 18px; }
      .modal p { margin: 0 0 12px; color: var(--ink); text-transform: none; font-weight: normal; }
      .modal input {
        font: bold 22px var(--font);
        width: 5em;
        text-align: center;
        margin: 0 0 14px;
        padding: 4px;
        background: #0b0e1c;
        color: var(--gold);
        border: 3px solid var(--edge);
      }
      .modal input.nope { animation: nope 0.3s; border-color: #ff4d6d; }
      .modal-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      .modal.win { border-color: var(--gold); }
      .modal.win h2 {
        font-size: 24px;
        color: var(--green);
        text-shadow: 0 0 10px rgba(44, 255, 110, 0.7), 2px 2px 0 #0a3a1a;
        animation: blink 0.5s steps(2) 4;
      }
      @keyframes nope { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
      @keyframes blink { 50% { opacity: 0.2; } }
      @media (max-width: 480px) {
        h1 { font-size: 15px; }
        #level-label { order: 3; flex-basis: 100%; font-size: 12px; }
        button { padding: 6px 8px; min-width: 30px; }
      }
    </style>
  </head>
  <body>
    <header id="bar">
      <h1>Laser Bounce</h1>
      <div class="buttons">
        <button id="btn-prev" title="Previous level (P)" aria-label="Previous level">◀</button>
        <button id="btn-next" title="Next level (N)" aria-label="Next level">▶</button>
        <button id="btn-undo" title="Undo (Ctrl/Cmd Z)" aria-label="Undo">↶</button>
        <button id="btn-redo" title="Redo (Ctrl/Cmd Shift Z)" aria-label="Redo">↷</button>
        <button id="btn-restart" title="Start again (R)" aria-label="Start again">↺</button>
        <button id="btn-help" title="Controls (?)" aria-label="Controls">?</button>
      </div>
      <div id="level-label"></div>
    </header>
    <main class="stage"><canvas id="board"></canvas></main>
    <p id="hint"></p>
    <aside id="help" hidden>
      <h2>Controls</h2>
      <button id="help-close" aria-label="Close">✕</button>
      <dl id="help-keys"></dl>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
